[project]
name = "pixorex-api"
version = "0.1.0"
description = "Pixorex FastAPI — Slice S2 auth/RBAC bridge to Keycloak and Postgres"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "PyJWT[crypto]>=2.9",
  "httpx>=0.27",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Keycloak (PX-01): SPI unit tests, realm import, end-to-end sign-in smoke test and image scan.
# Synthetic data and local-only credentials only (CONSTITUTION §2.10).
name: keycloak

on:
  pull_request:
    paths: ["keycloak/**", "docker-compose.yml", ".github/workflows/keycloak.yml"]
  push:
    branches: [main]
    paths: ["keycloak/**", "docker-compose.yml", ".github/workflows/keycloak.yml"]

permissions:
  contents: read

concurrency:
  group: keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spi-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KC_HTTP_PORT: "8080"
      KC_MGMT_PORT: "9100"
      KC_HOSTNAME: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: keycloak/spi/pom.xml

      - name: Build and unit-test the SPI
        run: mvn -B -ntp -f keycloak/spi/pom.xml verify

      - name: Install the provider jar
        run: cp keycloak/spi/target/pixorex-keycloak-spi.jar keycloak/providers/

      - name: Start Keycloak, its database, Mailpit and the audit event-sink
        run: docker compose up -d --wait --wait-timeout 300 keycloak-db mailpit event-sink keycloak

      - name: Sign-in smoke test
        shell: pwsh
        run: ./keycloak/scripts/kc-smoke.ps1

      - name: Keycloak logs
        if: failure()
        run: docker compose logs --no-color keycloak event-sink

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read the Keycloak image from docker-compose.yml
        id: image
        run: echo "ref=$(docker compose config --format json | jq -r '.services.keycloak.image')" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (blocks on critical, SPEC-PX-10)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

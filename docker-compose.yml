# Local development stack — synthetic data only.
# Credentials below are LOCAL-ONLY placeholders for throwaway containers. They are never
# reused anywhere else; real secrets live in Vault (CONSTITUTION §2.10, SPEC-PX-10 REQ-10.03).
# The api and worker services are added by PX-10-T01 / PX-10-T02.

name: pixorex

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pixorex
      POSTGRES_USER: ${PG_OWNER_USER:-pixorex_owner}
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:-local-only}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]   # postgres:18+ keeps data in a versioned subfolder of this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_OWNER_USER:-pixorex_owner} -d pixorex"]
      interval: 5s
      retries: 20

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-local-only}
    volumes: [kcdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-local-only}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-local-only}
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro      # realm-pixorex.json lands here (PX-01-T01)
      - ./keycloak/themes:/opt/keycloak/themes/pixorex:ro  # login theme (PX-01-T10)
    depends_on:
      keycloak-db: { condition: service_healthy }

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pixorex-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-minio}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  vault:
    image: hashicorp/vault:1.17
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-local-only}
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]   # SMTP, web inbox at http://localhost:8025

volumes:
  pgdata:
  kcdata:
  miniodata:

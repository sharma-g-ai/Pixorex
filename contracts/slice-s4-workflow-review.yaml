openapi: 3.1.0
info:
  title: Pixorex V1 API - Slice S4, workflow and review
  version: 0.3.0
  contact:
    name: Pixorex backend team (Amzur)
  summary: My Scans, self-review, decisions, override, delegation, escalation, alerts, audit log, quota and retention.
  description: 'Release Plan v2, Sprint 4 outcome: "Full scan-to-approval cycle is complete. Technician self-review
    mandatory. Rejection returns to original technician with category-based rework path."


    Data model: V3 Domain 5 (revision, revision_field, review_decision, review_batch, review_assignment, escalation)
    and Domain 6 (notification, audit_log, quota_usage, retention_config).


    Rules:

    - Revisions and decisions are insert-only. Each decision targets the current revision.

    - Nobody decides their own scan (403 /problems/own-scan; also a DB trigger).

    - First decider wins (409 /problems/already-decided).

    - Retake is a new scan in Slice S3 with retake_of_scan_id.

    - Escalations are created by a scheduled job after 24 h; batch no-progress alerts after 1 day and 1 week; no
    endpoints for these.'
servers:
- url: /api/v1
security:
- keycloakBearer: []
tags:
- name: My Scans
- name: Review
- name: Delegation
- name: Escalation
- name: Notifications
- name: Audit
- name: Quota
- name: Retention
paths:
  /me/scans:
    get:
      tags:
      - My Scans
      operationId: listMyScans
      summary: Technician's own scans by tab
      description: 'Contract ref 3.1 in the API Contracts doc.


        Needs action = ready_to_review, rejected, failed, retake_required; In progress = uploading, extracting,
        waiting_for_approval; Approved = approved. q searches name, serial and bin. Screens T 14, 26, 47-51, 56,
        62-64, 67, 70, 73.'
      x-roles: &id001
      - field_technician
      x-brd:
      - US-012b
      - US-016
      - US-031
      x-sprint: S4
      x-decision-pending: 'O-3: Release Plan status names differ from V3. O-10: Release Plan also wants My Scans
        on the web dashboard.'
      parameters:
      - name: bu_id
        in: query
        required: false
        schema:
          $ref: ./common.yaml#/components/schemas/Uuid
      - name: tab
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - needs_action
          - in_progress
          - approved
      - name: review_status
        in: query
        required: false
        schema:
          type: string
      - name: equipment_type_id
        in: query
        required: false
        schema:
          $ref: ./common.yaml#/components/schemas/Uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: q
        in: query
        required: false
        schema:
          type: string
      - &id002
        $ref: ./common.yaml#/components/parameters/Cursor
      - &id003
        $ref: ./common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyScan'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /scans/{scanId}/revisions:
    post:
      tags:
      - My Scans
      operationId: submitRevision
      summary: Submit self-review, or fix and resubmit after a rejection
      description: 'Contract ref 3.2 in the API Contracts doc.


        Scan must be ready_to_review (draft) or rejected. origin = rejection_fix after a rejection, and resubmit_to_user_id
        = who rejected. Progress before submit stays on the phone. Audit (review). Screens T 57-61, 69-70, 80.'
      x-roles: *id001
      x-brd:
      - US-012
      - US-012c
      - US-013
      - US-031
      x-sprint: S4
      parameters:
      - &id006
        $ref: ./common.yaml#/components/parameters/IdempotencyKey
      - &id004
        $ref: '#/components/parameters/ScanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      responses:
        '201':
          description: Revision created; waiting_for_approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          description: 'Not your scan. Problem types: /problems/forbidden.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          description: 'Wrong state, a flagged field has no verdict, or a required field is empty without submit_anyway.
            Problem types: /problems/invalid-state, /problems/flags-not-reviewed, /problems/required-fields-empty.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
  /business-units/{buId}/review-queue:
    get:
      tags:
      - Review
      operationId: getReviewQueue
      summary: Review queue with tab counts
      description: 'Contract ref 3.3 in the API Contracts doc.


        Counts also feed the BU Admin home cards. Screens BU 03, 05, 08, 10.'
      x-roles: &id009
      - bu_admin
      - enterprise_admin
      x-brd:
      - US-012b
      - US-031
      x-sprint: S4
      parameters:
      - &id007
        $ref: ./common.yaml#/components/parameters/BuId
      - name: filter
        in: query
        required: false
        schema:
          type: string
          enum:
          - waiting
          - over_1d
          - over_1w
          - delegated
          - decided_by_technicians
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueue'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /scans/{scanId}/review:
    get:
      tags:
      - Review
      operationId: getScanReview
      summary: AI value vs technician value
      description: 'Contract ref 3.4 in the API Contracts doc.


        Admins of the unit, or the technician assigned to it. Screens BU 07, 20, 22; EA 05; T 75.'
      x-roles: &id005
      - field_technician
      - bu_admin
      - enterprise_admin
      x-brd:
      - US-012b
      - US-031
      x-sprint: S4
      parameters:
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReview'
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          description: 'Own scan, or no right to review it. Problem types: /problems/own-scan, /problems/forbidden.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
  /scans/{scanId}/decisions:
    post:
      tags:
      - Review
      operationId: decideScan
      summary: Approve or reject the current revision
      description: 'Contract ref 3.5 in the API Contracts doc.


        reject_category required when rejecting (400). Resolves an open escalation. An admin deciding a delegated
        scan marks its assignment removed (admin_decided) and alerts the technician (scan_removed_from_batch). Alerts
        the scan''s technician (scan_approved / scan_rejected). Audit (review). Screens BU 07, 20-21; EA 05-07;
        T 75-76.'
      x-roles: *id005
      x-brd:
      - US-012b
      - US-013
      - US-031
      x-sprint: S4
      x-decision-pending: 'O-9: Release Plan lets the reviewer edit values; V3 does not. O-21: whether the reject
        note is required.'
      parameters:
      - *id006
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision_id:
                    $ref: ./common.yaml#/components/schemas/Uuid
                  review_status:
                    type: string
                required:
                - decision_id
                - review_status
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          description: 'Own scan, or not assigned to you. Problem types: /problems/own-scan, /problems/forbidden.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          description: 'Someone decided first, or scan not waiting for approval. Problem types: /problems/already-decided,
            /problems/invalid-state.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
  /business-units/{buId}/technician-decisions:
    get:
      tags:
      - Review
      operationId: listTechnicianDecisions
      summary: Decisions made by delegated technicians
      description: 'Contract ref 3.6 in the API Contracts doc.


        Screen BU 19.'
      x-roles: &id008
      - bu_admin
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - *id007
      - name: decision
        in: query
        required: false
        schema:
          type: string
          enum:
          - approved
          - rejected
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TechnicianDecision'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /decisions/{decisionId}/override:
    post:
      tags:
      - Review
      operationId: overrideDecision
      summary: Override a delegated technician's decision
      description: 'Contract ref 3.7 in the API Contracts doc.


        Inserts a new decision with overrides_decision_id; the old one stops being current. Screens show only approval
        to rejection. Alerts the delegated technician (decision_overridden). Audit (override). Screens BU 22-23;
        T 77.'
      x-roles: *id008
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      x-decision-pending: 'O-21: whether the note is required.'
      parameters:
      - *id006
      - $ref: '#/components/parameters/DecisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '201':
          description: New decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision_id:
                    $ref: ./common.yaml#/components/schemas/Uuid
                required:
                - decision_id
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          description: 'Decision is not current, or not made by a delegated technician. Problem types: /problems/invalid-state.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
  /business-units/{buId}/delegates:
    get:
      tags:
      - Delegation
      operationId: listDelegates
      summary: Technicians who can take a batch
      description: 'Contract ref 3.8 in the API Contracts doc.


        Screens BU 06, 09, 11; EA 08.'
      x-roles: *id009
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      x-decision-pending: 'O-18: V3 has is_trusted_reviewer but no screen sets it; screens list every technician
        of the unit.'
      parameters:
      - *id007
      - name: scan_ids
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: ./common.yaml#/components/schemas/Uuid
        style: form
        explode: false
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delegate'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /business-units/{buId}/review-batches:
    post:
      tags:
      - Delegation
      operationId: createReviewBatch
      summary: Delegate 1 to 50 scans as one batch
      description: 'Contract ref 3.9 in the API Contracts doc.


        The technician''s own scans are left out. Alerts the technician (batch_delegated); an EA delegating also
        alerts the BU Admin (ea_delegated_in_unit). Audit (review). Screens BU 06, 09, 11, 14; EA 08-09, 32-35.'
      x-roles: *id009
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_to:
                  $ref: ./common.yaml#/components/schemas/Uuid
                scan_ids:
                  type: array
                  items:
                    $ref: ./common.yaml#/components/schemas/Uuid
              required:
              - assigned_to
              - scan_ids
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    $ref: ./common.yaml#/components/schemas/Uuid
                  batch_no:
                    type: string
                  assigned_scan_ids:
                    type: array
                    items:
                      $ref: ./common.yaml#/components/schemas/Uuid
                  excluded:
                    type: array
                    items:
                      $ref: '#/components/schemas/Excluded'
                required:
                - batch_id
                - batch_no
                - assigned_scan_ids
                - excluded
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '409':
          description: 'A scan is not waiting for approval or is already in an open batch. Problem types: /problems/already-assigned,
            /problems/invalid-state.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
    get:
      tags:
      - Delegation
      operationId: listReviewBatches
      summary: Batches of a unit
      description: 'Contract ref 3.10 in the API Contracts doc.


        Screen BU 13.'
      x-roles: *id009
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - *id007
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - completed
          - taken_back
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Batch'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /review-batches/{batchId}:
    get:
      tags:
      - Delegation
      operationId: getReviewBatch
      summary: One batch with its scans
      description: 'Contract ref 3.11 in the API Contracts doc.


        Admins of the unit, or the assigned technician. Screens BU 13; T 74.'
      x-roles: *id005
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - &id010
        $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: '#/components/schemas/Batch'
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                required:
                - batch
                - assignments
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
  /review-batches/{batchId}/reassign:
    post:
      tags:
      - Delegation
      operationId: reassignReviewBatch
      summary: Give a batch to another technician
      description: 'Contract ref 3.12 in the API Contracts doc.


        Closes open assignments (reassigned) and opens new ones; the new technician''s own scans are left out. Alerts
        (batch_reassigned). Audit (review). Screens BU 15-16.'
      x-roles: *id009
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_to:
                  $ref: ./common.yaml#/components/schemas/Uuid
              required:
              - assigned_to
      responses:
        '200':
          description: Reassigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    $ref: ./common.yaml#/components/schemas/Uuid
                  assigned_to:
                    $ref: ./common.yaml#/components/schemas/Uuid
                  excluded:
                    type: array
                    items:
                      $ref: '#/components/schemas/Excluded'
                required:
                - batch_id
                - assigned_to
                - excluded
        '400':
          $ref: ./common.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          description: 'Batch not active. Problem types: /problems/invalid-state.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
  /review-batches/{batchId}/take-back:
    post:
      tags:
      - Delegation
      operationId: takeBackReviewBatch
      summary: Take a batch back
      description: 'Contract ref 3.13 in the API Contracts doc.


        Open assignments become removed (taken_back); batch taken_back; saves take_back_message. Alerts (batch_taken_back).
        Audit (review). Screens BU 17-18.'
      x-roles: *id009
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type:
                  - string
                  - 'null'
      responses:
        '204':
          description: Taken back
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          description: 'Batch not active. Problem types: /problems/invalid-state.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
  /review-batches/{batchId}/remind:
    post:
      tags:
      - Delegation
      operationId: remindReviewBatch
      summary: Send a reminder to the batch technician
      description: 'Contract ref 3.14 in the API Contracts doc.


        Sets reminded_at. Alerts (batch_reminder). Screen BU 13.'
      x-roles: *id009
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - *id010
      responses:
        '200':
          description: Reminded
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminded_at:
                    $ref: ./common.yaml#/components/schemas/Timestamp
                required:
                - reminded_at
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
        '404':
          $ref: ./common.yaml#/components/responses/NotFound
        '409':
          description: 'Batch not active. Problem types: /problems/invalid-state.'
          content:
            application/problem+json:
              schema:
                $ref: ./common.yaml#/components/schemas/Problem
  /me/review-batches:
    get:
      tags:
      - Delegation
      operationId: listMyReviewBatches
      summary: Active batches assigned to me
      description: 'Contract ref 3.15 in the API Contracts doc.


        Screen T 74.'
      x-roles: *id001
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Batch'
                  page:
                    $ref: ./common.yaml#/components/schemas/PageInfo
        '401':
          $ref: ./common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./common.yaml#/components/responses/Forbidden
  /escalations:
    get:
      tags:
      - Escalation
      operationId: listEscalations
      summary: Escalated scans across units
      description: 'Contract ref 3.16 in the API Contracts doc.


        Created by the scheduled job once a scan has waited 24 h. Screens EA 04, 29-31.'
      x-roles: &id011
      - enterprise_admin
      x-brd:
      - none
      x-brd-note: No BRD story found in the earlier contract mapping; feature comes from V3 data model + 13 Oct
        screens. Confirm the story ID.
      x-sprint: S4
      parameters:
      - name: bu_id
        in: query
        required: false
        schema:
          $ref: ./common.yaml#/components/schemas/Uuid
      - name: reason
        in: query
        required: false
        schema:
          type: string
          enum:
          - not_approved_24h
          - no_bu_admin
      - name: open
        in: query
        required: false
        schema:
          type: boolean
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:

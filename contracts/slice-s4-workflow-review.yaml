components:
  securitySchemes:
    keycloakBearer:
      $ref: ./common.yaml#/components/securitySchemes/keycloakBearer
  parameters:
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        $ref: ./common.yaml#/components/schemas/Uuid
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        $ref: ./common.yaml#/components/schemas/Uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: ./common.yaml#/components/schemas/Uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        $ref: ./common.yaml#/components/schemas/Uuid
  schemas:
    RejectCategory:
      type: string
      enum:
      - image_unclear
      - data_correction_needed
      - wrong_equipment_type
      - other
    MyScan:
      type: object
      properties:
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        record_no:
          type: string
        equipment_type_name:
          type: string
        location_path:
          type: string
        processing_status:
          type: string
        review_status:
          type: string
        attempts_used:
          type: integer
        reject_category:
          type:
          - string
          - 'null'
        updated_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
      required:
      - scan_id
      - record_no
      - equipment_type_name
      - location_path
      - processing_status
      - review_status
      - attempts_used
      - reject_category
      - updated_at
    RevisionFieldInput:
      type: object
      properties:
        field_key:
          type: string
        verification_state:
          type: string
          enum:
          - accepted
          - corrected
          - unreadable
          - left_empty
        value:
          type:
          - string
          - 'null'
          description: Required for corrected
        unreadable_reason:
          type:
          - string
          - 'null'
          enum:
          - label_worn
          - not_on_nameplate
          - covered_or_unreachable
          - other
          - null
          description: Required for unreadable
        note:
          type:
          - string
          - 'null'
          description: Required for reason other
      required:
      - field_key
      - verification_state
    RevisionInput:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/RevisionFieldInput'
        submit_anyway:
          type: boolean
          description: Must be true to send required fields as left_empty
      required:
      - fields
    Revision:
      type: object
      properties:
        revision_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        revision_no:
          type: integer
        origin:
          type: string
          enum:
          - technician_review
          - rejection_fix
        empty_required_fields:
          type: array
          items:
            type: string
        review_status:
          type: string
      required:
      - revision_id
      - revision_no
      - origin
      - empty_required_fields
      - review_status
    QueueItem:
      type: object
      properties:
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        record_no:
          type: string
        equipment_type_name:
          type: string
        captured_by_name:
          type: string
        location_path:
          type: string
        flag_count:
          type: integer
        corrected_count:
          type: integer
        unreadable_count:
          type: integer
        waiting_since:
          $ref: ./common.yaml#/components/schemas/Timestamp
        batch_no:
          type:
          - string
          - 'null'
        assigned_to_name:
          type:
          - string
          - 'null'
      required:
      - scan_id
      - record_no
      - equipment_type_name
      - captured_by_name
      - location_path
      - flag_count
      - corrected_count
      - unreadable_count
      - waiting_since
      - batch_no
      - assigned_to_name
    ReviewQueue:
      type: object
      properties:
        counts:
          $ref: '#/components/schemas/QueueCounts'
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        page:
          $ref: ./common.yaml#/components/schemas/PageInfo
      required:
      - counts
      - items
      - page
    QueueCounts:
      type: object
      properties:
        waiting:
          type: integer
        over_1d:
          type: integer
        over_1w:
          type: integer
        delegated:
          type: integer
        decided_by_technicians:
          type: integer
      required:
      - waiting
      - over_1d
      - over_1w
      - delegated
      - decided_by_technicians
    ReviewField:
      type: object
      properties:
        field_key:
          type: string
        label:
          type: string
        ai_value:
          type:
          - string
          - 'null'
        confidence:
          type:
          - number
          - 'null'
        flag_reasons:
          type: array
          items:
            type: string
        technician_value:
          type:
          - string
          - 'null'
        verification_state:
          type: string
        unreadable_reason:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
      required:
      - field_key
      - label
      - ai_value
      - confidence
      - flag_reasons
      - technician_value
      - verification_state
      - unreadable_reason
      - note
    Decision:
      type: object
      properties:
        decision_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        revision_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        decision:
          type: string
          enum:
          - approved
          - rejected
        reject_category:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        decided_by_name:
          type: string
        decider_role:
          type: string
          enum:
          - bu_admin
          - enterprise_admin
          - delegated_technician
        is_current:
          type: boolean
        overrides_decision_id:
          type:
          - string
          - 'null'
          format: uuid
        decided_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
      required:
      - decision_id
      - revision_id
      - decision
      - reject_category
      - note
      - decided_by_name
      - decider_role
      - is_current
      - overrides_decision_id
      - decided_at
    ScanReview:
      type: object
      properties:
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        record_no:
          type: string
        equipment_type_name:
          type: string
        location_path:
          type: string
        captured_by_name:
          type: string
        photos:
          type: array
          items:
            type: object
        current_revision:
          $ref: '#/components/schemas/Revision'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ReviewField'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
      required:
      - scan_id
      - record_no
      - equipment_type_name
      - location_path
      - captured_by_name
      - photos
      - current_revision
      - fields
      - decisions
    DecisionInput:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        reject_category:
          $ref: '#/components/schemas/RejectCategory'
        note:
          type:
          - string
          - 'null'
      required:
      - decision
    TechnicianDecision:
      type: object
      properties:
        decision_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        record_no:
          type: string
        decided_by_name:
          type: string
        decision:
          type: string
        reject_category:
          type:
          - string
          - 'null'
        decided_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
        overridden:
          type: boolean
      required:
      - decision_id
      - scan_id
      - record_no
      - decided_by_name
      - decision
      - reject_category
      - decided_at
      - overridden
    Delegate:
      type: object
      properties:
        user_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        full_name:
          type: string
        open_review_count:
          type: integer
        own_scans_in_selection:
          type: integer
      required:
      - user_id
      - full_name
      - open_review_count
      - own_scans_in_selection
    Excluded:
      type: object
      properties:
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        reason:
          type: string
          enum:
          - own_scan
      required:
      - scan_id
      - reason
    Batch:
      type: object
      properties:
        batch_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        batch_no:
          type: string
        assigned_to_name:
          type: string
        created_by_name:
          type: string
        scan_count:
          type: integer
        decided_count:
          type: integer
        created_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
        reminded_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - active
          - completed
          - taken_back
      required:
      - batch_id
      - batch_no
      - assigned_to_name
      - created_by_name
      - scan_count
      - decided_count
      - created_at
      - reminded_at
      - status
    Assignment:
      type: object
      properties:
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        record_no:
          type: string
        status:
          type: string
          enum:
          - assigned
          - decided
          - removed
        removed_reason:
          type:
          - string
          - 'null'
          enum:
          - taken_back
          - reassigned
          - admin_decided
          - user_removed
          - null
      required:
      - scan_id
      - record_no
      - status
      - removed_reason
    Escalation:
      type: object
      properties:
        escalation_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        record_no:
          type: string
        bu_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        bu_name:
          type: string
        reason:
          type: string
          enum:
          - not_approved_24h
          - no_bu_admin
        escalated_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
        reminded_at:
          type:
          - string
          - 'null'
          format: date-time
        batch_no:
          type:
          - string
          - 'null'
      required:
      - escalation_id
      - scan_id
      - record_no
      - bu_id
      - bu_name
      - reason
      - escalated_at
      - reminded_at
      - batch_no
    ScanRow:
      type: object
      properties:
        scan_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        record_no:
          type: string
        bu_name:
          type: string
        equipment_type_name:
          type: string
        captured_by_name:
          type: string
        location_path:
          type: string
        review_status:
          type: string
        captured_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
      required:
      - scan_id
      - record_no
      - bu_name
      - equipment_type_name
      - captured_by_name
      - location_path
      - review_status
      - captured_at
    Notification:
      type: object
      properties:
        notification_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        kind:
          $ref: '#/components/schemas/NotificationKind'
        title:
          type: string
        bu_id:
          type:
          - string
          - 'null'
          format: uuid
        object_type:
          type: string
        object_id:
          $ref: ./common.yaml#/components/schemas/Uuid
        created_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
        read_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - notification_id
      - kind
      - title
      - bu_id
      - object_type
      - object_id
      - created_at
      - read_at
    NotificationKind:
      type: string
      enum:
      - scan_waiting_1d
      - scan_waiting_1w
      - scans_escalated
      - unit_no_bu_admin
      - escalation_reminder
      - batch_delegated
      - batch_no_progress
      - batch_reminder
      - batch_reassigned
      - batch_taken_back
      - scan_removed_from_batch
      - scan_approved
      - scan_rejected
      - decision_overridden
      - ea_delegated_in_unit
      - invite_expired
      - export_ready
    AuditEntry:
      type: object
      properties:
        occurred_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
